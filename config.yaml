---
# Restart required. Slack retries with the same event_id are dispatched only once during this window.
slack_event_deduplication_window: 5m

# Restart required. Prometheus metrics are opt-in and do not affect health or readiness.
metrics:
  enabled: false
  path: /metrics

# Reloadable Obituary/User notify service configuration.
user:
  notify_channel: ""

# Reloadable shower thought service configuration.
# Requires user.notify_channel and an OpenAI API key at process startup.
showerthought:
  enabled: false
  business_hours_start: 8 # hour in 24h local time (inclusive)
  business_hours_end: 15 # hour in 24h local time (exclusive)

# Reloadable AI Chat service configuration, including personas and enable/disable.
# Requires an OpenAI API key at process startup.
aichat:
  sticky_duration: 30m
  # Rate-limit non-mention messages. Set to false to let the bot respond to every message.
  rate_limit_enabled: true
  # Context limits to prevent token overflow and bound stored conversation history.
  max_context_messages: 10 # Maximum number of previous messages to include
  max_context_age: 2h # Maximum age to include or retain persisted messages
  max_context_tokens: 2000 # Approximate maximum tokens (4 chars ≈ 1 token)
  # Personas are optional flavor layered on top of a grounded, adaptive default voice.
  personas:
    office_comedian: |
      Add occasional dry workplace humor when the message invites it. Keep jokes kind and secondary to
      the answer; do not turn every message into a punchline or force a short reply.

    grumpy_mentor: |
      Use a gently seasoned engineering voice: pragmatic, candid, and occasionally wry. Explain tradeoffs
      clearly, acknowledge good ideas, and never let irritation or nostalgia replace useful guidance.

    caffeinated_intern: |
      Add light, genuine enthusiasm when it fits. Avoid excessive exclamation marks and do not invent
      urgency or solutions; match the user's pace and keep practical answers clear.

    zen_architect: |
      Favor calm, structured explanations and a systems perspective when relevant. Use metaphors sparingly,
      and answer direct or emotional questions plainly rather than turning them into koans.

    conspiracy_debugger: |
      When appropriate, use playful skepticism about debugging mysteries, clearly labeling speculation.
      Return to evidence and practical next steps; never present conspiracies or guesses as facts.

# Reloadable Vibecheck service configuration.
vibecheck:
  good_reactions: [ok]
  good_text: [V I B E C H E C K - P A S S E D]
  bad_reactions: [no_entry]
  bad_text: [V I B E C H E C K - F A I L E D]
  ban_duration: 5m

# Reloadable Chat responses service configuration.
chat:
  responses:
    - pattern: hello
      message: Hello there! How can I help you today?
      is_regexp: false
    - pattern: thanks|thank you|thx|ty
      message: You're welcome!
      is_regexp: true
      reactions: ["+1"]
    - pattern: .*vibe.*
      is_regexp: true
      reactions: [ok, vibecheck]
    - pattern: \bok\b|\bokay\b
      is_regexp: true
      reactions: [ok]
